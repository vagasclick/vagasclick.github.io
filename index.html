<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="yQigN6Y2hMkyqXraxrlb9k2KJJs6It0Sq0oZQw8xQrM"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vagas Click</title>

    <link rel="preconnect" href="https://script.google.com" crossorigin="anonymous"/>
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin="anonymous"/>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at top, #ffffff 0%, #f1f5f9 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        user-select: none;
      }

      .spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid #e2e8f0;
        border-top-color: #2563eb;
        animation: spin 0.7s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.12);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Mensagem principal */
      .loader-message {
        margin-top: 20px;
        font-size: 15px;
        font-weight: 500;
        color: #1e293b;
        letter-spacing: -0.2px;
      }

      /* Subtexto com dots animados */
      .loader-subtext {
        margin-top: 8px;
        font-size: 13px;
        color: #64748b;
        font-weight: 400;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .loader-subtext span {
        display: inline-flex;
        gap: 2px;
      }

      .loader-subtext span::before,
      .loader-subtext span::after,
      .loader-subtext span span {
        content: "";
        width: 4px;
        height: 4px;
        background: #64748b;
        border-radius: 50%;
        animation: dots 1.4s ease-in-out infinite;
      }

      .loader-subtext span::before {
        animation-delay: 0s;
      }

      .loader-subtext span::after {
        animation-delay: 0.2s;
      }

      .loader-subtext span span {
        animation-delay: 0.4s;
      }

      @keyframes dots {
        0%, 80%, 100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Marca */
      #loader::before {
        content: "Vagas Click";
        display: block;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #0f172a;
        margin-bottom: 24px;
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      #custom-iframe {
        width: 100%;
        height: 100vh;
        border: none;
        display: block;
        opacity: 0;
        transition: opacity 0.4s ease-in-out;
        background: #ffffff;
      }
    </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-message">Buscando as melhores vagas</div>
    <div class="loader-subtext">
      Aguarde
      <span><span></span></span>
    </div>
  </div>

  <iframe 
    id="custom-iframe" 
    src="https://script.google.com/macros/s/AKfycbydewaAX43MLDRoJP8AAu8PXl8-765clRFX2kHNE4ZG2XGhDzMqNZ45bFr_BsouAaVxQg/exec" 
    title="Vagas Click"
    onload="document.getElementById('loader').style.display='none'; this.style.opacity='1';">
  </iframe>

</body>
</html>
