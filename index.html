<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Vagas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
    }

    /* Tela de carregamento */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* Animação do círculo (Spinner) */
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb; /* Azul */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #475569;
      font-size: 16px;
      font-weight: 500;
    }

    /* Estilo do Iframe */
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }

    /* Classe para esconder o loading suavemente */
    .hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <!-- Tela de Carregamento -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Carregando...</div>
  </div>

  <!-- Substitua a URL abaixo pela sua URL do Apps Script terminada em /exec -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbydewaAX43MLDRoJP8AAu8PXl8-765clRFX2kHNE4ZG2XGhDzMqNZ45bFr_BsouAaVxQg/exec"
    onload="hideLoading()">
  </iframe>

  <script>
    function hideLoading() {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
