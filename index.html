    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(to bottom, #15295e 0%, #15295e 52%, #bac3d4 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        user-select: none;
      }

      /* Disco claro + anel girando + pontos dentro */
      .spinner {
        position: relative;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: #eef1f6;
        box-shadow: 0 6px 20px rgba(9, 20, 50, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }

      .spinner::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #dde3ea;
        border-top-color: #2563eb;
        animation: spin 0.8s linear infinite;
      }

      .spinner span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #2563eb;
        animation: dots 1.2s ease-in-out infinite;
      }

      .spinner span:nth-child(2) { animation-delay: 0.15s; }
      .spinner span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes dots {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
        40%           { opacity: 1;    transform: scale(1.15); }
      }
