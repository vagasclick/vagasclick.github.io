<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Vagas de Emprego</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
    }

    #loading {
      position: fixed; inset: 0; background: #fff; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .4s ease, visibility .4s ease;
    }
    #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .spinner {
      width: 42px; height: 42px;
      border: 4px solid #e2e8f0; border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { color: #475569; font-size: 16px; font-weight: 500; }

    iframe { width: 100%; height: 100vh; border: none; display: block; }

    #pill {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #2563eb; color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: 13px; font-weight: 600; text-decoration: none; z-index: 10000;
      box-shadow: 0 6px 20px rgba(37, 99, 235, .4);
    }
    #pill.hidden { display: none; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Carregando...</div>
  </div>

  <a id="pill" class="hidden" target="_blank" rel="noopener" href="#">Não carregou? Abrir em nova aba ↗</a>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbydewaAX43MLDRoJP8AAu8PXl8-765clRFX2kHNE4ZG2XGhDzMqNZ45bFr_BsouAaVxQg/exec"
    onload="hideLoading()">
  </iframe>

  <script>
    var pill = document.getElementById('pill');
    pill.href = document.getElementById('appFrame').src;
    var pillTimer;

    function hideLoading() {
      document.getElementById('loading').classList.add('hidden');
      // Botão discreto por 8s: saída se o navegador bloquear o conteúdo (tela branca)
      pill.classList.remove('hidden');
      clearTimeout(pillTimer);
      pillTimer = setTimeout(function () { pill.classList.add('hidden'); }, 8000);
    }

    // Segurança: o spinner nunca fica girando para sempre
    setTimeout(hideLoading, 30000);
  </script>

</body>
</html>
